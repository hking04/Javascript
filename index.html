<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Notas</title>

    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <section class="calculadora">

            <h1>Calculadora de Notas</h1>

            <p class="descripcion">
                Ingresa tus tres notas para calcular tu promedio.
            </p>

            <div class="campo">
                <label for="nota1">Corte 1</label>
                <input 
                    type="number" 
                    id="nota1" 
                    min="0" 
                    max="5" 
                    step="0.1"
                    placeholder="Ej: 4.2"
                >
            </div>

            <div class="campo">
                <label for="nota2">Corte 2</label>
                <input 
                    type="number" 
                    id="nota2" 
                    min="0" 
                    max="5" 
                    step="0.1"
                    placeholder="Ej: 3.5"
                >
            </div>

            <div class="campo">
                <label for="nota3">Corte 3</label>
                <input 
                    type="number" 
                    id="nota3" 
                    min="0" 
                    max="5" 
                    step="0.1"
                    placeholder="Ej: 4.8"
                >
            </div>

            <button onclick="calcularPromedio()">
                Calcular promedio
            </button>

            <div id="resultado" class="resultado"></div>

        </section>

    </main>

</body>

</html>
